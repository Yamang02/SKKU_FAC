    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="성균관대학교 순수미술동아리 갤러리">
        <meta name="keywords" content="SKKU, 성균관대학교, 순수미술, 동아리, 갤러리, 전시">
        <meta name="author" content="SKKU 순수미술동아리">

        <!-- Open Graph Meta Tags -->
        <meta property="og:title" content="SKKU 순수미술동아리 갤러리">
        <meta property="og:description" content="성균관대학교 순수미술동아리의 창작 활동과 작품들을 만나보세요">
        <meta property="og:type" content="website">
        <meta property="og:locale" content="ko_KR">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="SKKU 순수미술동아리 갤러리">
        <meta name="twitter:description" content="성균관대학교 순수미술동아리의 창작 활동과 작품들을 만나보세요">

        <!-- FontAwesome Icons - 여러 방법으로 시도 -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
            integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />

        <!-- 백업 FontAwesome CDN -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css">


        <title>SKKU 순수미술동아리 갤러리</title>

        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                    sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background-color: #f8f9fa;
            }

            #root {
                min-height: 100vh;
            }

            .loading {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-size: 18px;
                color: #2c3e50;
            }

            .loading::after {
                content: '';
                width: 20px;
                height: 20px;
                margin-left: 10px;
                border: 2px solid #f3f3f3;
                border-top: 2px solid #2c3e50;
                border-radius: 50%;
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }

            /* FontAwesome 아이콘 기본 스타일 */
            .fas,
            .far,
            .fab {
                font-weight: 900;
                font-family: "Font Awesome 6 Free", "Font Awesome 6 Pro", "Font Awesome 6 Brands";
            }
        </style>
    </head>

    <body>
        <noscript>
            <div style="text-align: center; padding: 50px; font-size: 18px; color: #e74c3c;">
                JavaScript를 활성화해주세요. 이 애플리케이션은 JavaScript가 필요합니다.
            </div>
        </noscript>

        <div id="root">
            <div class="loading">로딩 중</div>
        </div>

        <!-- FontAwesome 로드 확인 스크립트 -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // FontAwesome 로드 확인
                const testElement = document.createElement('i');
                testElement.className = 'fas fa-home';
                testElement.style.visibility = 'hidden';
                document.body.appendChild(testElement);

                const computedStyle = window.getComputedStyle(testElement, '::before');
                const content = computedStyle.getPropertyValue('content');

                if (content && content !== 'none' && content !== '""') {
                    console.log('✅ FontAwesome이 성공적으로 로드되었습니다.');
                } else {
                    console.error('❌ FontAwesome 로드에 실패했습니다.');
                }

                document.body.removeChild(testElement);
            });
        </script>
    </body>

</html>
